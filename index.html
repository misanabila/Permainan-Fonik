<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Pengembaraan Fonik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Fredoka One', cursive; touch-action: none; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        
        /* UI Overlays */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); color: white; text-align: center; z-index: 10; transition: opacity 0.3s; }
        .hidden { display: none !important; }
        
        h1 { font-size: 3rem; margin-bottom: 20px; color: #FFD700; text-shadow: 3px 3px 0 #FF4500, -1px -1px 0 #FF4500, 1px -1px 0 #FF4500, -1px 1px 0 #FF4500, 1px 1px 0 #FF4500; }
        h2 { font-size: 2rem; color: #FFF; }
        
        .btn { padding: 15px 30px; font-size: 1.5rem; font-family: 'Fredoka One', cursive; color: white; background: #FF4500; border: 4px solid #FFF; border-radius: 20px; cursor: pointer; margin: 10px; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn:hover { transform: scale(1.1); background: #FF6347; }
        .btn.blue { background: #1E90FF; }
        .btn.green { background: #32CD32; }
        
        /* HUD */
        #hud { position: absolute; top: 10px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; color: white; text-shadow: 2px 2px 0 #000; z-index: 5; pointer-events: none; }
        #hud-controls { pointer-events: auto; }
        
        /* Question Panel */
        #questionPanel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFF; border: 8px solid #FFD700; border-radius: 30px; padding: 40px; text-align: center; z-index: 20; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 80%; max-width: 500px; }
        #q-letter { font-size: 5rem; margin: 0; color: #1E90FF; }
        #q-options { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .opt-btn { font-size: 2.5rem; padding: 15px 30px; background: #FF69B4; color: white; border: none; border-radius: 15px; cursor: pointer; font-family: 'Fredoka One', cursive; transition: transform 0.2s; box-shadow: 0 5px 0 #C71585; }
        .opt-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #C71585; }
        #feedback { font-size: 1.5rem; margin-top: 20px; height: 30px; color: #32CD32; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hidden">
        <div>Nyawa: <span id="livesText">❤️❤️❤️</span> | Markah: <span id="scoreText">0</span> | Tahap: <span id="levelText">1</span></div>
        <div id="hud-controls">
            <button class="btn blue" style="padding: 5px 15px; font-size:1rem;" onclick="toggleBGM()">🎵 Muzik</button>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="overlay">
        <h1>Misi Pengembaraan Fonik</h1>
        <button class="btn green" onclick="startGame()">MULA BERMAIN</button>
        <button class="btn blue" onclick="alert('CARA BERMAIN:\n\nA/D atau Kiri/Kanan: Bergerak\nSpace / Atas: Melompat\nLompat dan sentuh Kotak Soalan (?) untuk menjawab soalan fonik!')">CARA BERMAIN</button>
    </div>

    <!-- Question Panel -->
    <div id="questionPanelOverlay" class="overlay hidden">
        <div id="questionPanel">
            <h2>Dengar bunyi dan pilih huruf!</h2>
            <p id="q-letter">?</p>
            <button class="btn blue" onclick="playCurrentPhonics()">🔊 Dengar Bunyi</button>
            <div id="q-options"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <!-- Game Over / Win Screens -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1>MISI TAMAT</h1>
        <h2 id="finalScoreDisplay">Markah: 0</h2>
        <button class="btn green" onclick="resetGame()">CUBA LAGI</button>
    </div>
    
    <div id="winScreen" class="overlay hidden">
        <h1>TAHNIAH! MISI SELESAI!</h1>
        <h2 id="winScoreDisplay">Markah: 0</h2>
        <button class="btn green" onclick="resetGame()">MAIN SEMULA</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. TETAPAN AUDIO & BANK SOALAN
    // ==========================================
    // Sila sediakan folder "audio" dan letakkan fail-fail mp3 di bawah.
    
    const AUDIO_FILES = {
        bgm: 'audio/background.mp3',
        jump: 'audio/jump.mp3',
        coin: 'audio/coin.mp3',
        box: 'audio/box.mp3',
        correct: 'audio/correct.mp3',
        wrong: 'audio/wrong.mp3',
        gameover: 'audio/gameover.mp3',
        win: 'audio/win.mp3'
    };

    // Bank Soalan Fonik
    const PHONICS_DATA = {
        b: { audio: 'audio/b.mp3', correct: 'b', wrong: ['d', 'p'] },
        m: { audio: 'audio/m.mp3', correct: 'm', wrong: ['n', 'w'] },
        s: { audio: 'audio/s.mp3', correct: 's', wrong: ['c', 'z'] },
        a: { audio: 'audio/a.mp3', correct: 'a', wrong: ['o', 'e'] }
    };

    // Audio Elements Cache
    const audios = {};
    let bgmAudio = null;
    let isBgmPlaying = false;

    function initAudio() {
        for (let key in AUDIO_FILES) {
            audios[key] = new Audio(AUDIO_FILES[key]);
        }
        bgmAudio = new Audio(AUDIO_FILES.bgm);
        bgmAudio.loop = true;
        bgmAudio.volume = 0.3;
    }

    function playSound(name) {
        if (audios[name]) {
            audios[name].currentTime = 0;
            audios[name].play().catch(() => { /* Abaikan jika fail belum ada */ });
        }
    }

    function toggleBGM() {
        if (!bgmAudio) return;
        if (isBgmPlaying) {
            bgmAudio.pause();
            isBgmPlaying = false;
        } else {
            bgmAudio.play().catch(()=>{});
            isBgmPlaying = true;
        }
    }

    let currentPhonicsAudio = null;
    function playCurrentPhonics() {
        if (currentPhonicsAudio) {
            if (isBgmPlaying) bgmAudio.volume = 0.1; // Perlahankan muzik latar
            currentPhonicsAudio.currentTime = 0;
            currentPhonicsAudio.play().catch(()=>{ console.log("Letakkan fail audio fonik dalam folder yang betul."); });
            currentPhonicsAudio.onended = () => {
                if (isBgmPlaying) bgmAudio.volume = 0.3; // Kembalikan volume
            };
        }
    }

    // ==========================================
    // 2. PEMBOLEH UBAH PERMAINAN & KANVAS
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'menu'; // menu, playing, question, gameover, win
    let currentLevel = 1;
    let lives = 3;
    let score = 0;
    
    let camera = { x: 0 };
    let keys = {};
    let currentQuestionBox = null;

    // Entiti Permainan
    let player = { x: 50, y: 300, width: 40, height: 40, vx: 0, vy: 0, speed: 5, jumpPower: -12, grounded: false };
    let platforms = [];
    let boxes = [];
    let finishLine = { x: 0, y: 0, w: 50, h: 200 };

    // ==========================================
    // 3. REKA BENTUK TAHAP (LEVEL DESIGN)
    // ==========================================
    function loadLevel(levelNum) {
        platforms = [];
        boxes = [];
        player.x = 50;
        player.y = 200;
        player.vx = 0;
        player.vy = 0;
        camera.x = 0;

        let bgColors = ['#87CEEB', '#2E8B57', '#9370DB']; // Taman, Hutan, Istana
        document.body.style.backgroundColor = bgColors[levelNum - 1];

        // Platform Asas (Lantai)
        platforms.push({ x: 0, y: 500, w: 2500, h: 100 });

        // Tetapan tahap berbeza
        if (levelNum === 1) {
            platforms.push({ x: 300, y: 400, w: 150, h: 20 });
            boxes.push({ x: 350, y: 280, w: 40, h: 40, letter: 'a', used: false });
            
            platforms.push({ x: 700, y: 350, w: 150, h: 20 });
            boxes.push({ x: 750, y: 230, w: 40, h: 40, letter: 'b', used: false });
            
            finishLine = { x: 1200, y: 300, w: 50, h: 200 };
        } else if (levelNum === 2) {
            platforms.push({ x: 400, y: 350, w: 100, h: 20 });
            boxes.push({ x: 430, y: 230, w: 40, h: 40, letter: 'm', used: false });
            finishLine = { x: 1500, y: 300, w: 50, h: 200 };
        } else {
            platforms.push({ x: 500, y: 300, w: 100, h: 20 });
            boxes.push({ x: 530, y: 180, w: 40, h: 40, letter: 's', used: false });
            finishLine = { x: 1800, y: 300, w: 50, h: 200 };
        }
    }

    // ==========================================
    // 4. KAWALAN & FIZIK
    // ==========================================
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function updatePhysics() {
        if (gameState !== 'playing') return;

        // Pergerakan Kiri/Kanan
        if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
        else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
        else player.vx = 0;

        // Lompat
        if ((keys['Space'] || keys['ArrowUp']) && player.grounded) {
            player.vy = player.jumpPower;
            player.grounded = false;
            playSound('jump');
        }

        // Graviti
        player.vy += 0.6; // Tarikan graviti
        player.y += player.vy;
        player.x += player.vx;

        // Had kiri
        if (player.x < 0) player.x = 0;

        // Perlanggaran (Collision) dengan Platform
        player.grounded = false;
        for (let p of platforms) {
            if (player.x < p.x + p.w && player.x + player.width > p.x &&
                player.y + player.height > p.y && player.y < p.y + p.h) {
                
                // Mendarat di atas
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                }
            }
        }

        // Perlanggaran dengan Kotak Soalan
        for (let b of boxes) {
            if (!b.used && player.x < b.x + b.w && player.x + player.width > b.x &&
                player.y + player.height > b.y && player.y < b.y + b.h) {
                
                // Hit dari bawah atau sentuh
                b.used = true;
                playSound('box');
                triggerQuestion(b);
            }
        }

        // Perlanggaran Garisan Penamat
        if (player.x < finishLine.x + finishLine.w && player.x + player.width > finishLine.x &&
            player.y + player.height > finishLine.y && player.y < finishLine.y + finishLine.h) {
            levelComplete();
        }

        // Jatuh ke dalam gaung
        if (player.y > canvas.height + 100) {
            loseLife();
        }

        // Kamera mengikut watak
        camera.x = player.x - 300;
        if (camera.x < 0) camera.x = 0;
    }

    // ==========================================
    // 5. SISTEM SOALAN FONIK
    // ==========================================
    function triggerQuestion(box) {
        gameState = 'question';
        currentQuestionBox = box;
        let qData = PHONICS_DATA[box.letter];
        
        currentPhonicsAudio = new Audio(qData.audio);
        
        document.getElementById('questionPanelOverlay').classList.remove('hidden');
        document.getElementById('feedback').innerText = '';
        
        // Sediakan butang jawapan
        let options = [qData.correct, ...qData.wrong];
        options.sort(() => Math.random() - 0.5); // Rawakkan
        
        let optionsDiv = document.getElementById('q-options');
        optionsDiv.innerHTML = '';
        
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, qData.correct);
            optionsDiv.appendChild(btn);
        });

        playCurrentPhonics();
    }

    function checkAnswer(selected, correct) {
        let feedback = document.getElementById('feedback');
        if (selected === correct) {
            playSound('correct');
            feedback.style.color = '#32CD32';
            feedback.innerText = 'Hebat! Jawapan Betul!';
            score += 100;
            updateHUD();
            
            setTimeout(() => {
                document.getElementById('questionPanelOverlay').classList.add('hidden');
                gameState = 'playing';
            }, 1500);
        } else {
            playSound('wrong');
            feedback.style.color = 'red';
            feedback.innerText = 'Cuba lagi! Dengar dengan teliti.';
            loseLife(false);
        }
    }

    // ==========================================
    // 6. KAWALAN PERMAINAN & LUKISAN
    // ==========================================
    function loseLife(resetPosition = true) {
        lives--;
        updateHUD();
        if (lives <= 0) {
            gameState = 'gameover';
            playSound('gameover');
            document.getElementById('questionPanelOverlay').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScoreDisplay').innerText = "Markah: " + score;
        } else if (resetPosition) {
            player.x -= 100; // Undur sikit
            player.y = 200;
            player.vy = 0;
        }
    }

    function levelComplete() {
        if (currentLevel < 3) {
            currentLevel++;
            updateHUD();
            loadLevel(currentLevel);
        } else {
            gameState = 'win';
            playSound('win');
            document.getElementById('winScreen').classList.remove('hidden');
            document.getElementById('winScoreDisplay').innerText = "Markah Keseluruhan: " + score;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === 'menu') return;

        ctx.save();
        ctx.translate(-camera.x, 0);

        // Lukis Platform (Rumput)
        ctx.fillStyle = '#32CD32';
        for (let p of platforms) {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#8B4513'; // Tanah
            ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
            ctx.fillStyle = '#32CD32';
        }

        // Lukis Kotak Soalan
        for (let b of boxes) {
            if (b.used) {
                ctx.fillStyle = '#888'; // Kelabu jika dah guna
            } else {
                ctx.fillStyle = '#FFD700'; // Emas
            }
            ctx.fillRect(b.x, b.y, b.w, b.h);
            
            // Simbol ?
            if (!b.used) {
                ctx.fillStyle = '#FFF';
                ctx.font = '24px "Fredoka One"';
                ctx.fillText('?', b.x + 12, b.y + 28);
            }
        }

        // Lukis Penamat
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillRect(finishLine.x, finishLine.y, finishLine.w, finishLine.h);
        ctx.fillStyle = '#FF4500';
        ctx.font = '20px "Fredoka One"';
        ctx.fillText('TAMAT', finishLine.x - 10, finishLine.y - 20);

        // Lukis Watak (Bulatan comel)
        ctx.fillStyle = '#FF4500';
        ctx.beginPath();
        ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2, 0, Math.PI * 2);
        ctx.fill();
        // Mata
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(player.x + 25, player.y + 15, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(player.x + 27, player.y + 15, 3, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    }

    function gameLoop() {
        updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 7. SISTEM MENU
    // ==========================================
    function updateHUD() {
        let hearts = '';
        for(let i=0; i<lives; i++) hearts += '❤️';
        document.getElementById('livesText').innerText = hearts;
        document.getElementById('scoreText').innerText = score;
        document.getElementById('levelText').innerText = currentLevel;
    }

    function startGame() {
        initAudio();
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        toggleBGM();
        gameLoop();
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('winScreen').classList.add('hidden');
        lives = 3;
        score = 0;
        currentLevel = 1;
        gameState = 'playing';
        updateHUD();
        loadLevel(currentLevel);
    }

</script>
</body>
</html>
